<!-- templates/_pc_content.html -->

<div class="char-card pc" data-id="{{ pc.id }}">
    <h2>
        <span data-pc-name="{{ pc.name }}"> {{ pc.name }}</span>
    </h2>
    <p> Skill: {{ pc.skill }}</p>
    <p> Stamina: {{ pc.stamina }}</p>
    <p> Luck: {{ pc.luck }}</p>
    {% include "_dice.html" %}
    <button data-action="delete_character">✨ Delete PC</button>
</div>
